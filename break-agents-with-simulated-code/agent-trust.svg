<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect width="900" height="300" fill="#ffffff"/>

  <!-- trusted -->
  <text x="30" y="52" font-size="11" fill="#888">trusted</text>
  <rect x="30" y="62" width="250" height="70" rx="6" fill="#ffffff" stroke="#111"/>
  <text x="155" y="92" font-size="13" text-anchor="middle" fill="#111">system prompt</text>
  <text x="155" y="114" font-size="11" text-anchor="middle" fill="#555">the only intended instruction</text>

  <!-- untrusted -->
  <text x="30" y="182" font-size="11" fill="#888">untrusted</text>
  <rect x="30" y="192" width="250" height="88" rx="6" fill="#ffffff" stroke="#111" stroke-dasharray="5 3"/>
  <text x="155" y="216" font-size="13" text-anchor="middle" fill="#111">everything else</text>
  <text x="155" y="238" font-size="11" text-anchor="middle" fill="#555">user input, tool description</text>
  <text x="155" y="256" font-size="11" text-anchor="middle" fill="#555">memory record, retrieved page</text>

  <!-- agent -->
  <rect x="380" y="95" width="190" height="120" rx="6" fill="#f2f2f2" stroke="#bbb"/>
  <text x="475" y="132" font-size="13" text-anchor="middle" fill="#111">agent</text>
  <text x="475" y="156" font-size="11" text-anchor="middle" fill="#555">LLM</text>
  <text x="475" y="176" font-size="11" text-anchor="middle" fill="#555">+ tools</text>
  <text x="475" y="196" font-size="11" text-anchor="middle" fill="#555">+ memory</text>

  <!-- action -->
  <rect x="680" y="95" width="190" height="120" rx="6" fill="#ffffff" stroke="#111"/>
  <text x="775" y="132" font-size="13" text-anchor="middle" fill="#111">action</text>
  <text x="775" y="156" font-size="11" text-anchor="middle" fill="#555">reply</text>
  <text x="775" y="176" font-size="11" text-anchor="middle" fill="#555">send email</text>
  <text x="775" y="196" font-size="11" text-anchor="middle" fill="#555">tool call</text>

  <!-- arrows -->
  <line x1="280" y1="97" x2="371" y2="130" stroke="#111" stroke-width="1.5"/>
  <polygon points="365,121 380,132 363,136" fill="#111"/>
  <line x1="280" y1="236" x2="371" y2="180" stroke="#111" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="363,174 380,178 365,189" fill="#111"/>
  <line x1="570" y1="155" x2="671" y2="155" stroke="#111" stroke-width="1.5"/>
  <polygon points="671,150 680,155 671,160" fill="#111"/>

  <text x="450" y="270" font-size="11" text-anchor="middle" fill="#555">both arrive as text; the model does not tell one channel from the other</text>
</svg>

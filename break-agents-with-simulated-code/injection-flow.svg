<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect width="920" height="300" fill="#ffffff"/>

  <!-- 1 -->
  <rect x="20" y="80" width="190" height="120" rx="6" fill="#ffffff" stroke="#111"/>
  <text x="115" y="108" font-size="13" text-anchor="middle" fill="#111">untrusted text</text>
  <text x="115" y="134" font-size="11" text-anchor="middle" fill="#555">user prompt</text>
  <text x="115" y="154" font-size="11" text-anchor="middle" fill="#555">tool description</text>
  <text x="115" y="174" font-size="11" text-anchor="middle" fill="#555">memory record</text>

  <!-- 2 -->
  <rect x="250" y="80" width="190" height="120" rx="6" fill="#ffffff" stroke="#111"/>
  <text x="345" y="108" font-size="13" text-anchor="middle" fill="#111">model context</text>
  <text x="345" y="134" font-size="11" text-anchor="middle" fill="#555">system prompt</text>
  <text x="345" y="154" font-size="11" text-anchor="middle" fill="#555">tool schemas</text>
  <text x="345" y="174" font-size="11" text-anchor="middle" fill="#555">app state</text>

  <!-- 3 -->
  <rect x="480" y="80" width="190" height="120" rx="6" fill="#f2f2f2" stroke="#bbb"/>
  <text x="575" y="108" font-size="13" text-anchor="middle" fill="#111">simulated python</text>
  <text x="575" y="134" font-size="11" text-anchor="middle" fill="#555">dd = locals()[name]</text>
  <text x="575" y="154" font-size="11" text-anchor="middle" fill="#555">print(dd[10:-1])</text>

  <!-- 4 -->
  <rect x="710" y="80" width="190" height="120" rx="6" fill="#ffffff" stroke="#111"/>
  <text x="805" y="108" font-size="13" text-anchor="middle" fill="#111">result</text>
  <text x="805" y="134" font-size="11" text-anchor="middle" fill="#555">secret printed</text>
  <text x="805" y="154" font-size="11" text-anchor="middle" fill="#555">tool call executed</text>

  <!-- arrows -->
  <line x1="210" y1="140" x2="242" y2="140" stroke="#111" stroke-width="1.5"/>
  <polygon points="242,135 250,140 242,145" fill="#111"/>
  <line x1="440" y1="140" x2="472" y2="140" stroke="#111" stroke-width="1.5"/>
  <polygon points="472,135 480,140 472,145" fill="#111"/>
  <line x1="670" y1="140" x2="702" y2="140" stroke="#111" stroke-width="1.5"/>
  <polygon points="702,135 710,140 702,145" fill="#111"/>

  <text x="460" y="240" font-size="11" text-anchor="middle" fill="#555">the text is read as code, and the model runs it against its own context</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect width="920" height="190" fill="#ffffff"/>

  <!-- 1: repo -->
  <rect x="30" y="40" width="190" height="90" rx="6" fill="#ffffff" stroke="#111"/>
  <text x="125" y="64" font-size="13" text-anchor="middle" fill="#111">arkenfox repo</text>
  <text x="125" y="86" font-size="11" text-anchor="middle" fill="#555">user.js</text>
  <text x="125" y="104" font-size="11" text-anchor="middle" fill="#555">updater.sh</text>
  <text x="125" y="122" font-size="11" text-anchor="middle" fill="#555">prefsCleaner.sh</text>

  <!-- 2: profile -->
  <rect x="260" y="40" width="190" height="90" rx="6" fill="#ffffff" stroke="#111"/>
  <text x="355" y="64" font-size="13" text-anchor="middle" fill="#111">profile folder</text>
  <text x="355" y="86" font-size="11" text-anchor="middle" fill="#555">user.js</text>
  <text x="355" y="104" font-size="11" text-anchor="middle" fill="#555">user-overrides.js</text>

  <!-- 3: updater -->
  <rect x="490" y="40" width="190" height="90" rx="6" fill="#f2f2f2" stroke="#bbb"/>
  <text x="585" y="64" font-size="13" text-anchor="middle" fill="#111">updater.sh</text>
  <text x="585" y="86" font-size="11" text-anchor="middle" fill="#555">merges the overrides</text>
  <text x="585" y="104" font-size="11" text-anchor="middle" fill="#555">into user.js</text>

  <!-- 4: firefox -->
  <rect x="720" y="40" width="170" height="90" rx="6" fill="#ffffff" stroke="#111"/>
  <text x="805" y="64" font-size="13" text-anchor="middle" fill="#111">Firefox start</text>
  <text x="805" y="86" font-size="11" text-anchor="middle" fill="#555">applies the prefs</text>
  <text x="805" y="104" font-size="11" text-anchor="middle" fill="#555">on every launch</text>

  <!-- arrows -->
  <line x1="220" y1="85" x2="252" y2="85" stroke="#111" stroke-width="1.5"/>
  <polygon points="252,80 260,85 252,90" fill="#111"/>
  <line x1="450" y1="85" x2="482" y2="85" stroke="#111" stroke-width="1.5"/>
  <polygon points="482,80 490,85 482,90" fill="#111"/>
  <line x1="680" y1="85" x2="712" y2="85" stroke="#111" stroke-width="1.5"/>
  <polygon points="712,80 720,85 712,90" fill="#111"/>

  <text x="460" y="170" font-size="11" text-anchor="middle" fill="#555">run the updater after every arkenfox update</text>
</svg>
